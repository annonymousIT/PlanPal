# Minimal CI: catch the obvious breakages (build fails, tests fail, type errors)
# before they hit main. Two parallel jobs so frontend type-check doesn't wait
# for the Go test suite and vice versa.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum

      - name: Verify modules are tidy
        # Catches the "I forgot to commit go.mod/go.sum after adding a dep" bug.
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Test
        # -race catches data races in the goroutine-heavy paths
        # (calendar sync, feedback updates, Google push).
        run: go test -race ./...

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        # tsc --noEmit catches type errors that Next.js build would only surface late.
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        # Smoke test that Next.js actually compiles. Env var stub avoids
        # the build choking on undefined NEXT_PUBLIC_API_URL.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build
